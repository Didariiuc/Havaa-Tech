services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["rag"]
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  qdrant_data:
